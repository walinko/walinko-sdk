name: PHP subtree split (Packagist mirror)

# Public Packagist requires composer.json at the repo root, but our composer
# package lives at sdks/php/. Each push to main mirrors that subdirectory
# into a thin read-only repo (walinko/walinko-php) that Packagist watches.
# This is the same pattern Symfony, Laravel, and Doctrine use.
#
# Required to enable:
#   - org variable WALINKO_PHP_MIRROR_REPO   = walinko/walinko-php
#   - org secret   WALINKO_PHP_MIRROR_TOKEN  = PAT with `contents: write` on
#                                              the mirror repo
#
# Tag handling: a `php-vX.Y.Z` tag in this repo is mirrored to the read-only
# repo as `vX.Y.Z` so Packagist publishes it as version X.Y.Z.

on:
  push:
    branches: [main]
    tags: ['php-v*']
    paths:
      - 'sdks/php/**'
      - '.github/workflows/php-split.yml'
  workflow_dispatch:

# Serialize runs so a fast follow-up commit can't race the previous push.
concurrency:
  group: php-split
  cancel-in-progress: false

jobs:
  split:
    name: Split sdks/php → walinko-php
    runs-on: ubuntu-latest
    if: ${{ vars.WALINKO_PHP_MIRROR_REPO != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history is required by `git subtree split`

      # splitsh-lite's Go module tags no longer install cleanly on modern
      # toolchains; `git subtree split` is built into Git and produces the
      # same kind of subdirectory-only history for the mirror push.
      - name: Compute split SHA (git subtree)
        id: split
        run: |
          TMP_BRANCH="__php_split_${GITHUB_RUN_ID}"
          git subtree split --prefix=sdks/php -b "$TMP_BRANCH"
          SHA=$(git rev-parse "$TMP_BRANCH")
          git branch -D "$TMP_BRANCH"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Split SHA: $SHA"

      - name: Push branch to mirror
        env:
          MIRROR: ${{ vars.WALINKO_PHP_MIRROR_REPO }}
          TOKEN:  ${{ secrets.WALINKO_PHP_MIRROR_TOKEN }}
          SHA:    ${{ steps.split.outputs.sha }}
        run: |
          git remote add mirror "https://x-access-token:${TOKEN}@github.com/${MIRROR}.git"
          # The mirror is exclusively written by this workflow, so a plain
          # force push is safe; the upstream "source of truth" history lives
          # in this monorepo.
          git push mirror "${SHA}:refs/heads/main" --force

      - name: Push tag to mirror (php-vX.Y.Z → vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/php-v')
        env:
          MIRROR: ${{ vars.WALINKO_PHP_MIRROR_REPO }}
          TOKEN:  ${{ secrets.WALINKO_PHP_MIRROR_TOKEN }}
          SHA:    ${{ steps.split.outputs.sha }}
        run: |
          # Strip the `php-` prefix so Packagist sees a SemVer tag (vX.Y.Z).
          SOURCE_TAG="${GITHUB_REF#refs/tags/}"
          TARGET_TAG="${SOURCE_TAG#php-}"
          echo "Mirroring ${SOURCE_TAG} → ${TARGET_TAG} on ${MIRROR}"
          git push mirror "${SHA}:refs/tags/${TARGET_TAG}"
